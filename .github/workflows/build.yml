name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Restore release keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            chmod 600 "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets are unavailable; building an unsigned release APK."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APKs
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          gradle assembleDebug assembleRelease
          -PreleaseStoreFile=$RUNNER_TEMP/release.keystore
          -PreleaseStorePassword=$RELEASE_STORE_PASSWORD
          -PreleaseKeyAlias=$RELEASE_KEY_ALIAS
          -PreleaseKeyPassword=$RELEASE_KEY_PASSWORD

      - name: Build unsigned APKs
        if: steps.signing.outputs.available != 'true'
        run: gradle assembleDebug assembleRelease

      - name: Set up artifact client
        run: |
          npm install --global @actions/artifact@2.3.2
          echo "NODE_PATH=$(npm root --quiet --global)" >> "$GITHUB_ENV"

      - name: Expose artifact runtime variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env.ACTIONS_RUNTIME_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Upload APKs individually
        shell: node {0}
        env:
          BUILD_OUTPUT_DIR: app/build/outputs/apk
        run: |
          const fs = require('fs');
          const path = require('path');
          const { DefaultArtifactClient } = require('@actions/artifact');

          function findApks(directory) {
            const apkFiles = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                apkFiles.push(...findApks(entryPath));
              } else if (entry.isFile() && entry.name.endsWith('.apk')) {
                apkFiles.push(entryPath);
              }
            }
            return apkFiles.sort();
          }

          async function main() {
            const outputDirectory = process.env.BUILD_OUTPUT_DIR;
            const apkFiles = findApks(outputDirectory);

            if (apkFiles.length === 0) {
              throw new Error(`No APK files found in ${outputDirectory}`);
            }

            console.log(`Found ${apkFiles.length} APK file(s).`);
            const artifactClient = new DefaultArtifactClient();

            for (const apkPath of apkFiles) {
              const artifactName = path.basename(apkPath);
              console.log(`Uploading ${apkPath} as ${artifactName}`);
              const result = await artifactClient.uploadArtifact(
                artifactName,
                [apkPath],
                path.dirname(apkPath),
                { skipArchive: true }
              );
              console.log(
                `Uploaded ${artifactName}: id=${result.id}, size=${result.size} bytes`
              );
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
