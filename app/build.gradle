plugins {
    id 'com.android.application'
}

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.canRead()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseStoreFile = project.findProperty('releaseStoreFile')
        ?: releaseSigningProperties.getProperty('releaseStoreFile')
        ?: rootProject.file('release.keystore')
def releaseStorePassword = project.findProperty('releaseStorePassword')
        ?: releaseSigningProperties.getProperty('releaseStorePassword')
def releaseKeyAlias = project.findProperty('releaseKeyAlias')
        ?: releaseSigningProperties.getProperty('releaseKeyAlias')
def releaseKeyPassword = project.findProperty('releaseKeyPassword')
        ?: releaseSigningProperties.getProperty('releaseKeyPassword')
def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.toString().isBlank() }

if (!hasReleaseSigning) {
    logger.lifecycle('Release APKs will be unsigned: release signing credentials were not provided.')
}

android {
    namespace = 'moe.shuvi.schemesinterceptor'
    compileSdk 37

    defaultConfig {
        applicationId 'moe.shuvi.schemesinterceptor'
        minSdk 24
        targetSdk 37
        versionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName = (project.findProperty('versionName') ?: '1.0').toString()
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword '123456'
            keyAlias 'androiddebugkey'
            keyPassword '123456'
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
            def architecture = abi == null
                    ? 'Universal'
                    : [
                            'armeabi-v7a': 'ARMv7',
                            'arm64-v8a' : 'ARMv8',
                            'x86'       : 'x86',
                            'x86_64'    : 'x86_64'
                    ][abi] ?: abi
            def signingConfig = android.buildTypes.getByName(variant.buildType).signingConfig
            def signatureSuffix = signingConfig == null ? '-unsigned' : ''
            output.outputFileName.set("app-${architecture}-${variant.buildType}${signatureSuffix}.apk")
        }
    }
}


apply from: rootProject.file('gradle/scheme-manifest.gradle')

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
}
